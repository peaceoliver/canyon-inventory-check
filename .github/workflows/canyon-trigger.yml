- name: Trigger Streamlit App
        run: |
          node -e "
          const playwright = require('playwright');
          (async () => {
            const browser = await playwright.chromium.launch();
            const page = await browser.newPage();
            
            console.log('Navigálás a Streamlit appra...');
            // Cseréld ki a lenti URL-t a saját Streamlit appod URL-jére!
            await page.goto('https://canyon-inventory-check.streamlit.app/?run=true', { waitUntil: 'domcontentloaded' });
            
            // Megnézzük, hogy alszik-e az app. Ha igen, megnyomjuk az ébresztő gombot.
            try {
              const wakeUpButton = page.locator('button:has-text(\"Wake up app\")');
              if (await wakeUpButton.isVisible({ timeout: 5000 })) {
                console.log('Az app alszik! Ébresztő gomb megnyomása...');
                await wakeUpButton.click();
              }
            } catch (e) {
              console.log('Az app nem aludt, vagy nem találtam ébresztő gombot.');
            }

            // Várunk, amíg a Streamlit app ténylegesen betölt (emelt időkorlát: 90 másodperc)
            console.log('Várakozás az app betöltésére...');
            await page.waitForSelector('.stApp', { timeout: 90000 });
            
            console.log('Sikeresen lefutott a trigger!');
            await browser.close();
          })();
          "
