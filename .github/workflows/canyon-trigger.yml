name: Canyon Inventory Trigger

on:
  schedule:
    - cron: '0 * * * *'  # Minden óra 0. percében lefut
  workflow_dispatch:     # Manuális indítás gomb

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Browsers
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Trigger Streamlit App
        run: |
          node -e "
          const playwright = require('playwright');
          (async () => {
            try {
              const browser = await playwright.chromium.launch();
              const page = await browser.newPage();
              
              console.log('1. LÉPÉS: Navigálás a https://canyon.streamlit.app/?run=true címre...');
              await page.goto('https://canyon.streamlit.app/?run=true', { waitUntil: 'load', timeout: 90000 });
              
              console.log('2. LÉPÉS: Ellenőrizzük, hogy alszik-e az alkalmazás...');
              const wakeUpButton = page.getByRole('button', { name: 'Wake up app' });
              
              if (await wakeUpButton.isVisible({ timeout: 5000 })) {
                console.log('-> Az app alszik! Kattintás a \"Wake up app\" gombra...');
                await wakeUpButton.click();
                console.log('-> Gomb megnyomva. Várunk 30 másodpercet, amíg a szerver felébred...');
                await page.waitForTimeout(30000);
              } else {
                console.log('-> Az app nem alszik, aktív.');
              }

              console.log('3. LÉPÉS: Várakozás a csoportos ellenőrzés lefutására (max 5 perc)...');
              console.log('-> A robot most nyitva tartja az oldalt, amíg a Python kódod a háttérben szkennel és e-mailt küld.');
              
              // Megvárjuk, amíg a kód lefutását jelző szövegek egyike megjelenik a felületen
              await page.waitForFunction(() => {
                const text = document.body.innerText;
                return text.includes('csoportos ellenőrzés lezajlott') || 
                       text.includes('Nincs aktív figyelés') || 
                       text.includes('Találatok születtek');
              }, null, { timeout: 300000 });
              
              console.log('4. LÉPÉS: SIKER! Az ellenőrzés sikeresen lefutott, a robot leállhat.');
              await browser.close();
              
            } catch (error) {
              console.error('❌ KRITIKUS HIBA A FUTÁS SORÁN:', error.message);
              process.exit(1);
            }
          })();
          "
