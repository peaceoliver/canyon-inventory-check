name: Canyon Inventory Trigger

on:
  schedule:
    - cron: '0 * * * *'  # Minden óra 0. percében lefut
  workflow_dispatch:     # Ezzel kapsz egy manuális "Run workflow" gombot is a GitHubon

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install playwright

      - name: Trigger Streamlit App
        run: |
          node -e "
          const playwright = require('playwright');
          (async () => {
            const browser = await playwright.chromium.launch();
            const page = await browser.newPage();
            
            console.log('Navigálás a Streamlit appra...');
            await page.goto('https://canyon.streamlit.app/?run=true', { waitUntil: 'domcontentloaded' });
            
            try {
              // Megkeressük a Streamlit alvó gombját, ha elaludt volna az app
              const wakeUpButton = page.getByRole('button', { name: 'Wake up app' });
              if (await wakeUpButton.isVisible({ timeout: 5000 })) {
                console.log('Az app alszik! Ébresztő gomb megnyomása...');
                await wakeUpButton.click();
              }
            } catch (e) {
              console.log('Az app nem aludt, vagy nem volt szükség ébresztésre.');
            }

            console.log('Várakozás az app betöltésére...');
            await page.waitForSelector('.stApp', { timeout: 90000 });
            
            console.log('Sikeresen lefutott a trigger!');
            await browser.close();
          })();
          "
